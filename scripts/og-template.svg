<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" fill="none" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="glow" cx="0.24" cy="0.5" r="0.9">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="55%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0a0a0a" />
  <rect width="1200" height="675" fill="url(#glow)" />

  <!-- Logo: same stroke mark as src/components/Logo.vue -->
  <g transform="translate(96, {{logoY}}) scale(1.6)">
    <path
      d="M46.1438 41.1245C47.1438 32.6245 40.841 29.2545 33.341 38.0027C21.341 52 37.341 63 43.8251 46.6245C45.781 43.1245 46.1438 38.0027 46.1438 38.0027C45.5227 43.2757 44.3251 45.6045 44.3251 49.6245C46.5 42 48.5 35 51.5 35C53.5 35 53 52 54 58C55 51 57 35 60 35C62.5 35 62 52 63 58C64 51 66 35 69 35C71.5 35 71 52 72 58C72.5 61 74 61 77 52"
      stroke="#fdfdfd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    />
  </g>

  <!-- Author -->
  <text x="274" y="{{nameY}}" fill="#8b8b8b" font-family="Inter, DejaVu Sans, sans-serif" font-size="32" xml:space="preserve">Alexis Mabanza</text>

  <!-- Title -->
  <text fill="#fdfdfd" font-family="Inter, DejaVu Sans, sans-serif" font-size="50" letter-spacing="0em" xml:space="preserve" style="white-space:pre">
    <tspan x="274" y="{{line1Y}}">{{line1}}</tspan>
    <tspan x="274" y="{{line2Y}}">{{line2}}</tspan>
    <tspan x="274" y="{{line3Y}}">{{line3}}</tspan>
  </text>

  <!-- Domain -->
  <text x="1060" y="618" fill="#5a5a5a" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" text-anchor="end" xml:space="preserve">alexvolkihar.ovh</text>
</svg>
